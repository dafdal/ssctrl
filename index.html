207,77,.35))}.logo b{font-size:18px;font-weight:900;letter-spacing:2px;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}.back-btn{display:inline-flex;align-items:center;gap:8px;padding:9px 18px;border:1px solid rgba(255,207,77,.4);color:#ffe9c2;font-size:13px;letter-spacing:2px;clip-path:polygon(9px 0,100% 0,100% calc(100% - 9px),calc(100% - 9px) 100%,0 100%,0 9px);transition:.3s;background:rgba(255,207,77,.05)}.back-btn:hover{background:var(--cy);color:#1c0c10;box-shadow:0 0 20px rgba(255,207,77,.4)}.back-btn svg{width:16px;height:16px}main{position:relative;z-index:2;max-width:960px;margin:0 auto;padding:56px 24px 80px}.page-head{text-align:center;margin-bottom:46px}.page-kick{font-family:var(--font-d);font-size:13px;letter-spacing:5px;color:var(--cy);text-transform:uppercase;margin-bottom:14px}.page-title{font-size:clamp(30px,4.6vw,48px);font-weight:900;letter-spacing:4px;background:linear-gradient(115deg,#fff,#ffe9c2 30%,#ffcf4d 60%,#be8cff);-webkit-background-clip:text;background-clip:text;color:transparent}.page-sub{margin-top:10px;color:var(--mut);font-size:14px;letter-spacing:2px}.novel-grid{display:grid;grid-template-columns:1fr 1fr;gap:22px}@media (max-width:720px){.novel-grid{grid-template-columns:1fr}}.novel-card{position:relative;display:flex;flex-direction:column;gap:14px;background:linear-gradient(165deg,rgba(30,22,42,.75),rgba(14,10,20,.94));border:1px solid var(--line);padding:30px 30px 34px;clip-path:polygon(16px 0,100% 0,100% calc(100% - 16px),calc(100% - 16px) 100%,0 100%,0 16px);transition:.35s;overflow:visible;cursor:pointer;text-align:left;font-family:inherit}.novel-card::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--grad);opacity:.85}.novel-card:hover{border-color:rgba(255,207,77,.6);transform:translateY(-5px);box-shadow:0 20px 50px rgba(2,2,10,.65),0 0 28px rgba(255,207,77,.14)}.check{display:flex;align-items:center;gap:10px}.check .box{flex:none;width:26px;height:26px;border:2px solid rgba(255,207,77,.75);background:rgba(255,207,77,.08);display:flex;align-items:center;justify-content:center;color:var(--cy);transition:.3s}.check .box svg{width:16px;height:16px}.check em{font-style:normal;font-family:var(--font-d);font-size:11px;letter-spacing:3px;color:var(--dim);text-transform:uppercase}.novel-card:hover .check .box{background:var(--cy);color:#1c0c10;box-shadow:0 0 14px rgba(255,207,77,.5)}.novel-name{font-size:26px;font-weight:900;letter-spacing:3px;color:#fff}.novel-name small{display:block;margin-top:6px;font-family:var(--font-d);font-size:11px;letter-spacing:4px;color:var(--mut);text-transform:uppercase;font-weight:500}.novel-desc{color:var(--mut);font-size:14px;line-height:1.85}.novel-card.disabled{opacity:.5;cursor:default;pointer-events:none}.novel-card.disabled:hover{transform:none;border-color:var(--line);box-shadow:none}/* ===== 汤学臻集 箭头下拉 ===== */.nsub-arrow{align-self:flex-start;display:inline-flex;align-items:center;justify-content:center;gap:8px;margin-top:2px;padding:8px 16px;border:1px solid rgba(255,207,77,.5);color:#ffd98a;font-size:13px;letter-spacing:2px;border-radius:999px;background:rgba(255,207,77,.06);transition:.3s;font-family:inherit;cursor:pointer}.nsub-arrow svg{width:15px;height:15px;transition:transform .35s}.novel-card.open .nsub-arrow svg{transform:rotate(180deg)}.nsub-arrow:hover{background:rgba(255,207,77,.18);color:#fff}.nsub-menu{display:none;flex-direction:column;gap:10px;margin-top:2px;padding-top:14px;border-top:1px dashed rgba(255,207,77,.25)}.novel-card.open .nsub-menu{display:flex;animation:subIn .3s ease}@keyframes subIn{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:none}}.nsub-item{display:flex;align-items:center;gap:12px;padding:13px 16px;border:1px solid rgba(255,207,77,.3);background:linear-gradient(135deg,rgba(255,207,77,.1),rgba(190,140,255,.1));border-radius:10px;color:#fff0d8;font-size:15px;letter-spacing:2px;transition:.3s;text-align:left}.nsub-item:hover{border-color:var(--cy);background:linear-gradient(135deg,rgba(255,207,77,.22),rgba(190,140,255,.22));box-shadow:0 0 16px rgba(255,207,77,.25);color:#fff}.nsub-item .dot{flex:none;width:10px;height:10px;border-radius:50%;background:var(--grad);box-shadow:0 0 8px rgba(255,207,77,.6)}.nsub-item .go{margin-left:auto;display:inline-flex;color:var(--cy)}.nsub-item .go svg{width:15px;height:15px}footer{position:relative;z-index:2;text-align:center;padding:30px;color:var(--dim);font-size:13px;border-top:1px solid var(--line);margin-top:40px}</style></head><body><div class="bg-glow"></div><header> <a class="logo" href="https://dafdal.github.io/"> <svg class="mark" viewBox="0 0 48 48" fill="none"><defs><linearGradient id="lg" x1="0" y1="0" x2="48" y2="48"><stop offset="0" stop-color="#ffcf4d"/><stop offset="1" stop-color="#be8cff"/></linearGradient></defs><rect x="2" y="2" width="44" height="44" rx="10" stroke="url(#lg)" stroke-width="2" fill="rgba(255,207,77,.06)"/><path d="M10 30c5-8 9-8 14 0s9 8 14 0" stroke="url(#lg)" stroke-width="2.6" stroke-linecap="round"/><path d="M10 20c5-8 9-8 14 0s9 8 14 0" stroke="url(#lg)" stroke-width="2.6" stroke-linecap="round" opacity=".5"/></svg> <b>大风大浪集团</b> </a> <a class="back-btn" href="https://dafdal.github.io/"> <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M12 19l-7-7 7-7"/></svg> 返回首页 </a></header><main> <div class="page-head"> <p class="page-kick">NOVEL COLLECTION</p> <h1 class="page-title">小说集</h1> <p class="page-sub">选择你想要阅读的内容</p> </div> <div class="novel-grid"> <div class="novel-card" id="cardZhen"> <span class="check"><span class="box"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12.5l5 5L20 6.5"/></svg></span><em>SELECT · 01</em></span> <span class="novel-name">汤学臻集<small>DAFDAL COLLECTION</small></span> <span class="novel-desc">《来了一个新同学》，点开箭头选择正册或副册。</span> <button class="nsub-arrow" id="nsubBtn" type="button" aria-expanded="false">选择阅读<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg></button> <div class="nsub-menu" id="nsubMenu"> <a class="nsub-item" href="https://maipdf.cn/file/at6aa4b328e1cb3/pdf" target="_blank" rel="noopener"><span class="dot"></span>正册<span class="go"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg></span></a> <a class="nsub-item" href="https://maipdf.cn/file/at6ab3bb799f2fe/pdf" target="_blank" rel="noopener"><span class="dot"></span>副册<span class="go"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg></span></a> </div> </div> <div class="novel-card disabled" aria-disabled="true"> <span class="check"><span class="box"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12.5l5 5L20 6.5"/></svg></span><em>SELECT · 02</em></span> <span class="novel-name">涂寓帆集<small>COMING SOON</small></span> <span class="novel-desc">暂无内容，敬请期待。</span> </div> </div></main><footer>大风大浪集团 © 2026 版权所有</footer><script>(function(){"use strict";var card=document.getElementById("cardZhen");var btn=document.getElementById("nsubBtn");function toggle(force){var open=(force!=null)?force:!card.classList.contains("open");card.classList.toggle("open",open);btn.setAttribute("aria-expanded",open?"true":"false");}btn.addEventListener("click",function(e){e.stopPropagation();toggle();});card.addEventListener("click",function(e){if(e.target.closest("a"))return;toggle();});document.addEventListener("click",function(e){if(!card.contains(e.target))toggle(false);});}());</script></body></html>
